name: Update merged China rules

on:
  schedule:
    # Once per day at 00:17 UTC (08:17 Asia/Shanghai); GitHub may delay scheduled runs.
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'rules/China_Custom.list'
      - 'scripts/build_china.py'
      - '.github/workflows/update-china.yml'

permissions:
  contents: write

concurrency:
  group: update-china-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch upstream, validate and merge
        run: python3 scripts/build_china.py

      - name: Check required rules and format
        shell: bash
        run: |
          grep -qx 'DOMAIN-SUFFIX,qcc.com' rules/China.list
          grep -qx 'DOMAIN-SUFFIX,qichacha.com' rules/China.list
          grep -qx 'DOMAIN,sysdk.cl2009.com' rules/China.list
          grep -qx 'DOMAIN,analytics.oceanengine.com' rules/China.list
          ! grep -Eq '^\.' rules/China.list

      - name: Commit only if the merged output changed
        shell: bash
        run: |
          if git diff --quiet -- rules/China.list; then
            echo "China.list is already up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules/China.list
          git commit -m "chore: refresh merged China rules from blackmatrix7"
          git push
