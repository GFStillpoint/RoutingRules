name: Update routing rule subscriptions

on:
  schedule:
    # Daily at 00:17 UTC = 08:17 China Standard Time.
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sources/**'
      - 'scripts/**'
      - '.github/workflows/update-rules.yml'

permissions:
  contents: write

concurrency:
  group: update-loon-subscriptions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Fetch upstream and generate LIST and JSON subscriptions
        run: python3 scripts/build_rules.py

      - name: Verify expected rules and ensure no raw domain-set syntax
        shell: bash
        run: |
          for file in subscriptions/loon/US.list subscriptions/loon/Crypto.list subscriptions/loon/Direct.list subscriptions/loon/Overseas.list; do
            test -s "$file"
            ! grep -Eq '^\.' "$file"
          done
          grep -qx 'DOMAIN-SUFFIX,openai.com' subscriptions/loon/US.list
          grep -qx 'DOMAIN-SUFFIX,hyperliquid.xyz' subscriptions/loon/Crypto.list
          grep -qx 'DOMAIN-SUFFIX,qcc.com' subscriptions/loon/Direct.list
          grep -qx 'DOMAIN-SUFFIX,apple.com' subscriptions/loon/Direct.list
          grep -qx 'DOMAIN-SUFFIX,github.com' subscriptions/loon/Overseas.list

      - name: Install pinned sing-box compiler
        shell: bash
        run: |
          set -euo pipefail
          version=1.11.15
          archive="sing-box-${version}-linux-amd64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/SagerNet/sing-box/releases/download/v${version}/${archive}" \
            -o "$RUNNER_TEMP/$archive"
          echo "950af37eb2d7e55dddae34a18411cd617303fd99d2dc75bc76b6dd9fcd97d9c5  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/sing-box-${version}-linux-amd64/sing-box" "$RUNNER_TEMP/sing-box"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Compile and verify sing-box binary rule sets
        shell: bash
        run: |
          sing-box version
          python3 scripts/build_singbox.py
          for name in US Crypto Overseas Direct; do
            test -s "subscriptions/sing-box/$name.json"
            test -s "subscriptions/sing-box/$name.srs"
          done

      - name: Verify conflict reports
        shell: bash
        run: |
          test -s reports/conflicts.json
          test -s reports/conflicts.md
          python3 -m json.tool reports/conflicts.json > /dev/null

      - name: Commit changed generated files only
        shell: bash
        run: |
          git add subscriptions/ reports/
          if git diff --cached --quiet; then
            echo "All generated subscriptions are up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: refresh routing rule subscriptions and reports"
          git push
